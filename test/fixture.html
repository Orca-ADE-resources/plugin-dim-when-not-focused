<!doctype html>
<!-- Minimal copy of the Orca 1.4.222 workbench DOM that src/renderer-dim.js relies on:
     tab groups ([data-tab-group-body-id] inside a group with a strip), and terminals drawn in a
     separate overlay host on top of the group body, split into .pane[data-leaf-id] leaves. -->
<html class="dark">
<head>
<meta charset="utf-8">
<style>
  :root { --background: #0a0a0a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0a0a0a; color: #e5e5e5; font: 14px/1.4 Consolas, monospace; }
  .app-layout { display: flex; height: 100vh; }
  aside { width: 200px; border-right: 1px solid #333; padding: 8px; }
  main { flex: 1; position: relative; display: flex; }
  .group { flex: 1; display: flex; flex-direction: column; border-left: 1px solid #333; }
  .strip { height: 32px; border-bottom: 1px solid #333; display: flex; align-items: center; padding: 0 8px; }
  .body { flex: 1; position: relative; }
  .body textarea { width: 100%; height: 100%; background: transparent; color: inherit; border: 0; padding: 12px; font: inherit; }
  .overlay { position: absolute; inset: 0; pointer-events: none; }
  .host { position: absolute; z-index: 10; isolation: isolate; pointer-events: auto; display: flex; flex-direction: column; background: #282a36; }
  #groupA .body { background: #111111; }
  .pane { flex: 1; position: relative; padding: 12px; border-top: 1px solid #333; color: #9ef09e; }
  .pane textarea { position: absolute; left: 12px; top: 40px; width: 8px; height: 18px; opacity: 0; }
</style>
</head>
<body>
<div id="root">
  <div class="app-layout">
    <aside><input id="search" placeholder="sidebar search"></aside>
    <main id="workbench">
      <div class="group/tab-group group" id="groupA">
        <div class="strip" data-tab-group-strip-id="A"><button id="tabA">editor.ts</button></div>
        <div class="body" data-tab-group-body-id="A"><textarea id="editorA">const editor = 'group A';
function focused() { return true; }</textarea></div>
      </div>
      <div class="group/tab-group group" id="groupB">
        <div class="strip" data-tab-group-strip-id="B"><button id="tabB">terminal</button></div>
        <div class="body" data-tab-group-body-id="B"></div>
      </div>
      <div class="overlay">
        <div class="host" id="hostB" data-retained-pane-host data-terminal-overlay-tab-id="T1">
          <div class="pane" data-leaf-id="L1">$ claude  (split 1)<br>Thinking…<textarea class="xterm-helper-textarea" id="xt1"></textarea></div>
          <div class="pane" data-leaf-id="L2">$ npm test  (split 2)<br>PASS 12 tests<textarea class="xterm-helper-textarea" id="xt2"></textarea></div>
        </div>
      </div>
    </main>
  </div>
</div>
<div data-floating-terminal-panel="true" aria-hidden="true" style="position: fixed; left: 300px; top: 100px; width: 300px; height: 200px; visibility: hidden; opacity: 0;"></div>
<script>
  // Orca positions the terminal host over its group body; do the same.
  const place = () => {
    const body = document.querySelector('[data-tab-group-body-id="B"]').getBoundingClientRect();
    const main = document.getElementById('workbench').getBoundingClientRect();
    Object.assign(document.getElementById('hostB').style, {
      left: `${body.left - main.left}px`, top: `${body.top - main.top}px`, width: `${body.width}px`, height: `${body.height}px`,
    });
  };
  place();
  addEventListener('resize', place);
</script>
</body>
</html>
